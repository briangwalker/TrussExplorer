# Every pull request and every push to main runs the whole test suite (#147).
# The job is named run-all: the RequirePullRequests ruleset requires it to pass before a merge.
name: tests
on:
  pull_request:
  push:
    branches: [main, balsaPixel-1.0]
permissions:
  contents: read
# a newer push to the same pull request cancels its older run (pushes to main and balsaPixel-1.0 always finish)
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      # pinned versions, the same as a local run (tests/requirements.txt, package-lock.json; board TE-B-052/053)
      - name: Python packages for the course script
        run: pip install --require-hashes -r tests/requirements.txt
      - name: Playwright with Chromium
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Run every check
        env:
          MPLBACKEND: Agg
        run: bash tests/run_all.sh
      - name: Keep the built page (index.html isn't committed on balsaPixel-1.0)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: built-page
          path: program/index.html
          if-no-files-found: ignore
      - name: Keep the screenshots when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: test-screenshots
          path: program/tests/shots/
          if-no-files-found: ignore
